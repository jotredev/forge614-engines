name: Release standalone artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: git diff --check
      - run: bash -n scripts/install.sh
      - run: node --check scripts/release-bundle.mjs
      - run: node --check scripts/release-cut.mjs
      - run: node --check scripts/verify-windows-self-update.mjs

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            platform: darwin
            arch: arm64
            exe: ""
          - runner: macos-15-intel
            target: bun-darwin-x64
            platform: darwin
            arch: x64
            exe: ""
          - runner: ubuntu-latest
            target: bun-linux-x64
            platform: linux
            arch: x64
            exe: ""
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            platform: linux
            arch: arm64
            exe: ""
          - runner: windows-latest
            target: bun-windows-x64
            platform: windows
            arch: x64
            exe: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Read version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create the release directory layout
        shell: bash
        run: |
          name="forge614-engines-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          echo "release_name=$name" >> "$GITHUB_ENV"

      - name: Compile standalone binary
        run: bun build ./src/interfaces/cli/main.ts --compile --target=${{ matrix.target }} --outfile dist/${{ env.release_name }}/forge614-engines${{ matrix.exe }}

      - name: Copy package.json (carries the version install.sh/install.ps1 read)
        shell: bash
        run: cp package.json dist/${{ env.release_name }}/package.json

      - name: Smoke-test the native binary (unix)
        if: matrix.platform != 'windows'
        run: ./dist/${{ env.release_name }}/forge614-engines detect

      - name: Smoke-test the native binary (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $output = & ".\dist\$env:release_name\forge614-engines.exe" detect | ConvertFrom-Json
          if ($output.schemaVersion -ne 1) { throw "unexpected schemaVersion" }

      - name: Archive with the original file mode preserved
        shell: bash
        run: tar -czf dist/${{ env.release_name }}.tar.gz -C dist ${{ env.release_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ env.release_name }}.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble and validate release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate per-asset SHA256 checksums (the format install.sh/install.ps1 verify against)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Validate every expected asset is present, non-empty, and checksums verify
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cd dist
          for combo in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            archive="forge614-engines-${version}-${combo}.tar.gz"
            test -s "$archive" || { echo "missing or empty artifact: $archive" >&2; exit 1; }
            test -s "$archive.sha256" || { echo "missing checksum: $archive.sha256" >&2; exit 1; }
            sha256sum --check "$archive.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, assemble]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create the GitHub Release with the validated files only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            scripts/install.sh#install.sh \
            scripts/install.ps1#install.ps1 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
