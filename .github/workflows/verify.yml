name: Verify platforms
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run verify:docs
      - run: git diff --check

  build-smoke:
    name: Build and smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: windows-2025, target: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:target
        env:
          FORGE614_TARGET: ${{ matrix.target }}
      - run: bun run smoke:target
        env:
          FORGE614_TARGET: ${{ matrix.target }}

  actionlint:
    name: Validate workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1

  windows-deferred-removal:
    name: Windows deferred removal
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify removal can be scheduled through WMI
        shell: pwsh
        run: ./tests/e2e/windows-deferred-removal.e2e.ps1
