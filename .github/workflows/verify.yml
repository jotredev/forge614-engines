name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unix:
    name: Unix checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: git diff --check
      - run: bash -n scripts/install.sh
      - run: node --check scripts/release-bundle.mjs
      - run: node --check scripts/release-cut.mjs
      - run: node --check scripts/verify-release.mjs
      - run: node --check scripts/lib/semver.mjs
      - run: node --check scripts/lib/release-suggestion.mjs
      - run: node --check scripts/lib/git-log.mjs
      - run: node --check scripts/lib/tty.mjs
      - run: node --check scripts/verify-windows-self-update.mjs

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Disable Windows Defender real-time scanning for this job
        shell: pwsh
        continue-on-error: true
        run: |
          # Best-effort: a freshly-compiled, unsigned .exe that reads/writes
          # files, makes network calls, and spawns a child process (exactly
          # what forge614-engines update/self-update does) is the profile
          # Defender's cloud-delivered protection scrutinizes hardest, and a
          # real run here hung for several minutes on it. This is CI-only,
          # never done by the real install/update scripts a user runs.
          Set-MpPreference -DisableRealtimeMonitoring $true
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Build a windows-x64 artifact for install.ps1 to install
        shell: pwsh
        run: |
          # Version must satisfy install.ps1's strict X.Y.Z check (no
          # pre-release suffix) — same rule install.sh and release-cut.mjs
          # enforce, so a fake test version has to look like a real one.
          New-Item -ItemType Directory -Force -Path dist/release-test/forge614-engines-0.0.0-windows-x64 | Out-Null
          bun build ./src/interfaces/cli/main.ts --compile --target=bun-windows-x64 --outfile dist/release-test/forge614-engines-0.0.0-windows-x64/forge614-engines.exe
          Copy-Item package.json dist/release-test/forge614-engines-0.0.0-windows-x64/package.json
          $pkg = Get-Content dist/release-test/forge614-engines-0.0.0-windows-x64/package.json -Raw | ConvertFrom-Json
          $pkg.version = "0.0.0"
          $pkg | ConvertTo-Json | Set-Content dist/release-test/forge614-engines-0.0.0-windows-x64/package.json
          tar -czf dist/release-test/forge614-engines-0.0.0-windows-x64.tar.gz -C dist/release-test forge614-engines-0.0.0-windows-x64
      - name: Run install.ps1 against the local archive
        shell: pwsh
        env:
          FORGE614_HOME: ${{ github.workspace }}\.forge614-test-home
        run: |
          ./scripts/install.ps1 -Archive dist/release-test/forge614-engines-0.0.0-windows-x64.tar.gz
          $installed = "$env:FORGE614_HOME\engines\bin\forge614-engines.exe"
          if (-not (Test-Path $installed)) { throw "install.ps1 did not produce $installed" }
          $output = & $installed detect | ConvertFrom-Json
          if ($output.schemaVersion -ne 1) { throw "unexpected schemaVersion from installed binary" }
      - name: Verify self-update while the launcher is the currently-running process
        shell: pwsh
        timeout-minutes: 3
        env:
          FORGE614_HOME: ${{ github.workspace }}\.forge614-test-home
          FORGE614_LAUNCHER_PATH: ${{ github.workspace }}\.forge614-test-home\engines\bin\forge614-engines.exe
          FORGE614_DIAG_LOG: ${{ runner.temp }}\self-update-diag.log
        run: bun run scripts/verify-windows-self-update.mjs
      - name: Print self-update diagnostics (always, even if the check above timed out or failed)
        if: always()
        shell: pwsh
        env:
          FORGE614_HOME: ${{ github.workspace }}\.forge614-test-home
        run: |
          $log = "${{ runner.temp }}\self-update-diag.log"
          Write-Host "--- orchestrator diag log ($log) ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No diagnostic log at $log" }

          # Engines' own storage now honors FORGE614_HOME (matching
          # install.sh/install.ps1) rather than always defaulting to the real
          # $env:USERPROFILE\.forge614 — this must look in the same
          # FORGE614_HOME-relative directory the update step used, or these
          # logs are read from a location `update` never touched.
          $enginesHome = "$env:FORGE614_HOME\engines"

          # The orchestrator only prints the PowerShell swap-helper's own log
          # on its failure path — read directly from outside instead, so this
          # shows up even if the orchestrator itself is what's stuck.
          # -Exclude is required alongside -Filter here: "swap-helper-*.log"
          # on its own also matches "swap-helper-*.spawn.log" (the "*" is
          # greedy and happily eats ".spawn"), which merged both logs into
          # this section in an earlier run and hid the spawn-output log.
          $helperLogs = Get-ChildItem -Path $enginesHome -Filter "swap-helper-*.log" -Exclude "*.spawn.log" -ErrorAction SilentlyContinue
          if ($helperLogs) {
            foreach ($helperLog in $helperLogs) {
              Write-Host "--- swap helper log ($($helperLog.FullName)) ---"
              Get-Content $helperLog.FullName
            }
          } else {
            Write-Host "No swap-helper-*.log files found under $enginesHome"
          }

          # The script's own Out-File logging (above) is silent if pwsh/powershell
          # fails before reaching the script body (execution policy, parameter
          # binding, path quoting, etc). This captures the child process's raw
          # stdout/stderr instead, which surfaces exactly that kind of failure.
          $spawnLogs = Get-ChildItem -Path $enginesHome -Filter "swap-helper-*.spawn.log" -ErrorAction SilentlyContinue
          if ($spawnLogs) {
            foreach ($spawnLog in $spawnLogs) {
              Write-Host "--- swap helper spawn output ($($spawnLog.FullName)) ---"
              Get-Content $spawnLog.FullName
            }
          } else {
            Write-Host "No swap-helper-*.spawn.log files found under $enginesHome"
          }

          Write-Host "--- process list (any leftover forge614-engines/powershell children?) ---"
          Get-Process | Where-Object { $_.ProcessName -like "*forge614-engines*" -or $_.ProcessName -eq "powershell" } | Format-Table Id, ProcessName, StartTime
      - name: Run install.ps1 -Uninstall
        shell: pwsh
        env:
          FORGE614_HOME: ${{ github.workspace }}\.forge614-test-home
        run: |
          ./scripts/install.ps1 -Uninstall -Yes
          if (Test-Path "$env:FORGE614_HOME\engines") { throw "uninstall left files behind" }
